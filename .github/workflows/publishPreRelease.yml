name: Publish Pre-Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  parity:
    uses: ./.github/workflows/versionParity.yml

  validate:
    needs: parity
    if: needs.parity.outputs.is_prerelease == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      pre_release: true

  deploy:
    needs: [parity, validate]
    if: needs.parity.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download validated pre-release VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vscode-pandoc-vsix
          path: release-artifact

      - name: Publish pre-release to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1.7.0
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          preRelease: true
          extensionFile: release-artifact/vscode-pandoc.vsix

      - name: Publish pre-release to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1.7.0
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          preRelease: true
          extensionFile: release-artifact/vscode-pandoc.vsix
